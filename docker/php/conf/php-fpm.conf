; =============================================================================
; PHP-FPM pool – www
; =============================================================================
[www]
user                        = www-data
group                       = www-data

; ── Socket ────────────────────────────────────────────────────────────────────
; Listen on TCP for cross-container communication
listen                      = 0.0.0.0:9000
listen.backlog              = 512

; ── Process management ────────────────────────────────────────────────────────
pm                          = dynamic
pm.max_children             = 20
pm.start_servers            = 5
pm.min_spare_servers        = 2
pm.max_spare_servers        = 8
pm.max_requests             = 500
pm.process_idle_timeout     = 10s

; ── Status / ping endpoints (used by healthcheck) ─────────────────────────────
pm.status_path              = /status
ping.path                   = /ping
ping.response               = pong

; ── Logging ───────────────────────────────────────────────────────────────────
access.log                  = /proc/self/fd/2
access.format               = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d ms"
slowlog                     = /proc/self/fd/2
request_slowlog_timeout     = 5s

; ── Environment passthrough ───────────────────────────────────────────────────
clear_env                   = no

; ── Security ──────────────────────────────────────────────────────────────────
security.limit_extensions   = .php
