upstream php_fpm {
    server app:9000;
    keepalive 32;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /var/www/html/public;
    index index.php;

    add_header X-Frame-Options           "SAMEORIGIN"               always;
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-XSS-Protection          "1; mode=block"            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ui-avatars.com; connect-src 'self' wss:; frame-ancestors 'none';" always;

    limit_conn conn_limit 50;

    proxy_read_timeout      300;
    proxy_connect_timeout   300;
    proxy_send_timeout      300;
    fastcgi_read_timeout    300;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|composer\.(json|lock)|package\.json|artisan) {
        deny all;
        return 404;
    }

    location ~* ^/build/.+\.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
        log_not_found off;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires     30d;
        add_header  Cache-Control "public";
        access_log  off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log  off;
        log_not_found off;
    }
    location = /favicon.ico {
        access_log  off;
        log_not_found off;
    }

    location ~ ^/(login|register|password|api/auth) {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        include /etc/nginx/conf.d/php-fpm.params;
    }

    location ^~ /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        include /etc/nginx/conf.d/php-fpm.params;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /etc/nginx/conf.d/php-fpm.params;
    }

    location = /nginx-health {
        stub_status;
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;  # Docker bridge range
        deny  all;
        access_log off;
    }
}
